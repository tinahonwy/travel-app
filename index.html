<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>一起去旅行</title>
<link rel="icon" type="image/png" href="./LOGOJ-4.png">
<link rel="apple-touch-icon" sizes="180x180" href="./LOGOJ-4.png">
<meta name="apple-mobile-web-app-title" content="一起去旅行">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    --paper:#F7F3EA; --paper-card:#FFFFFF;
    --ink:#1B3A4B; --ink-soft:#3E5A6B;
    --vermillion:#C1440E; --vermillion-soft:#E9E1D3;
    --matcha:#6E7F3C; --muted:#8A8272; --border:#E4DDCB; --danger:#B3261E;
    --font-display:"Noto Serif TC",serif;
    --font-body:"Noto Sans TC",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;position:relative;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:var(--font-body);cursor:pointer;}
  a{color:var(--vermillion);}
  input,select,textarea{font-family:var(--font-body);}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:var(--paper);gap:8px;}
  .top-bar .brand{font-family:var(--font-display);font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;}
  .top-bar .brand .stamp{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--vermillion);color:var(--vermillion);font-size:11px;font-family:var(--font-display);flex-shrink:0;}
  .top-bar .user-info{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;min-width:0;flex-shrink:1;}
  .top-bar button.ghost{background:transparent;border:1px solid rgba(247,243,234,.4);color:var(--paper);padding:6px 12px;border-radius:999px;font-size:12.5px;flex-shrink:0;white-space:nowrap;}
  .top-bar button.ghost:hover{border-color:var(--paper);}
  .profile-trigger{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--paper);font-family:var(--font-body);font-size:13px;cursor:pointer;padding:0;min-width:0;max-width:100px;}
  .profile-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .profile-trigger:hover{opacity:.85;}
  .avatar-mini{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(247,243,234,.5);}
  .avatar-chip{border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px;flex-shrink:0;border:1px solid var(--border);background:#fff;}
  .avatar-mini-fallback{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;font-weight:600;color:#fff;}

  .modal-overlay{position:fixed;inset:0;background:rgba(27,58,75,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .modal-card{background:var(--paper-card);border-radius:18px;padding:24px;max-width:360px;width:100%;margin:auto;box-shadow:0 10px 40px rgba(27,58,75,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h3{margin:0;}
  .modal-close{background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 6px;}
  .modal-close:hover{color:var(--vermillion);}
  .avatar-edit{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px;}
  .avatar-preview{width:88px;height:88px;border-radius:50%;background:var(--vermillion-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:30px;font-weight:700;color:var(--vermillion);font-family:var(--font-display);}
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .color-picker{display:flex;flex-wrap:wrap;gap:10px;padding:2px 0;}
  .color-swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative;}
  .color-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper-card),0 0 0 4px var(--ink);}
  .color-swatch.taken{opacity:.25;cursor:not-allowed;}

  #root{max-width:100%;overflow-x:hidden;}
  .container{max-width:720px;margin:0 auto;padding:28px 18px 70px;}
  .container.has-tabbar{padding-bottom:90px;}

  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 6px;}
  h1{font-size:26px;} h2{font-size:19px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--vermillion);text-transform:uppercase;display:block;margin-bottom:4px;}
  .subtitle{color:var(--muted);font-size:13.5px;margin:0 0 20px;}

  .card{background:var(--paper-card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}

  .field{margin-bottom:14px;min-width:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;min-width:0;-webkit-min-logical-width:0;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink);}
  .date-wrap{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--border);background:var(--paper);max-width:100%;}
  .date-wrap input[type="date"]{border:none;background:transparent;width:100%;min-width:0;-webkit-min-logical-width:0;box-sizing:border-box;padding:10px 12px;font-size:14px;color:var(--ink);display:block;-webkit-appearance:none;appearance:none;}
  .date-wrap input[type="date"]:focus{outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ink-soft);outline-offset:1px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field{flex:1;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;border:none;font-size:14px;font-weight:600;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-accent{background:var(--vermillion);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .btn-danger{background:transparent;color:var(--danger);font-size:12.5px;padding:4px 8px;border:none;}
  .btn-block{width:100%;}

  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--paper-card);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:60;box-shadow:0 -2px 12px rgba(27,58,75,.06);}
  .tabbar-inner{max-width:720px;width:100%;display:flex;}
  .tab-btn{flex:1;background:transparent;border:none;padding:10px 4px 8px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;}
  .tab-btn .tab-ic{font-size:19px;}
  .tab-btn.active{color:var(--vermillion);font-weight:600;}

  .day-block{margin-bottom:18px;}
  .day-block-inner{display:flex;gap:14px;align-items:stretch;}
  .day-weekday{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--vermillion);flex-shrink:0;letter-spacing:2px;padding-top:2px;}
  .day-content{flex:1;min-width:0;}
  .day-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .date-tag{font-family:var(--font-mono);font-size:11.5px;color:var(--vermillion);background:var(--vermillion-soft);padding:3px 8px;border-radius:6px;margin-right:8px;}
  .item-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);}
  .edit-btn{background:transparent;color:var(--matcha);font-size:12px;padding:2px 4px;border:none;cursor:pointer;text-decoration:underline;}
  .item-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;}
  .item-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 16px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:56px;}
  .item-btn:active{transform:scale(.96);}
  .item-btn-edit{background:#E8EFDD;color:var(--matcha);}
  .item-btn-del{background:#FBEAE7;color:var(--danger);}
  .edit-item-form{background:var(--paper);border:1px dashed var(--border);border-radius:10px;padding:12px;margin:6px 0;}
  .item-row:last-child{border-bottom:none;}
  .item-time{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);width:auto;min-width:44px;max-width:78px;flex-shrink:0;padding-top:2px;line-height:1.4;}
  .item-body{flex:1;min-width:0;}
  .item-title{font-weight:600;font-size:13.5px;}
  .item-note{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .item-link{font-size:11.5px;display:inline-flex;align-items:center;gap:4px;margin-top:4px;}
  .item-link .link-ic{font-size:12px;line-height:1;}
  .memo-trigger-btn{background:none;border:none;color:var(--matcha);font-size:11.5px;display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:0;cursor:pointer;text-decoration:underline;font-family:var(--font-body);}

  .item-detail{padding:0;}
  .detail-section{margin-bottom:12px;}
  .detail-section:last-child{margin-bottom:0;}
  .detail-section-head{font-size:11.5px;letter-spacing:.06em;color:var(--vermillion);font-weight:700;margin-bottom:6px;text-transform:uppercase;}
  .detail-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-text{flex:1;min-width:0;word-break:break-word;}
  .detail-author{font-size:11px;color:var(--muted);}
  .detail-add-form{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .detail-add-form input[type="text"],.detail-add-form input[type="url"]{flex:1;min-width:100px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--paper-card);color:var(--ink);}
  .detail-add-form .btn{padding:8px 14px;font-size:12.5px;flex-shrink:0;white-space:nowrap;}
  .detail-memo-img{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex-shrink:0;border:1px solid var(--border);}
  .detail-img-preview-wrap{display:flex;align-items:center;gap:8px;}
  .detail-img-preview{max-width:80px;max-height:80px;border-radius:8px;border:1px solid var(--border);object-fit:cover;}

  .ct-display{font-family:var(--font-mono);font-size:20px;text-align:right;padding:12px 14px;background:var(--paper);border:1px solid var(--border);border-radius:10px;word-break:break-all;min-height:28px;}
  .ct-keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .ct-key{padding:14px 0;border-radius:10px;border:1px solid var(--border);background:var(--paper-card);font-size:16px;font-family:var(--font-mono);color:var(--ink);cursor:pointer;}
  .ct-key:active{transform:scale(.95);background:var(--paper);}
  .ct-key-op{background:var(--vermillion-soft);color:var(--vermillion);font-weight:700;}
  .ct-key-wide{grid-column:span 2;}

  .balance-list{list-style:none;padding:0;margin:0;}
  .balance-list li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
  .balance-list li:last-child{border-bottom:none;}
  .amount-positive{color:var(--matcha);font-family:var(--font-mono);}
  .amount-negative{color:var(--vermillion);font-family:var(--font-mono);}
  .amount-neutral{color:var(--muted);font-family:var(--font-mono);}
  .settle-row{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0;flex-wrap:wrap;}
  .settle-check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--matcha);cursor:pointer;user-select:none;padding:4px 10px 4px 6px;border-radius:999px;background:#E8EFDD;}
  .settle-check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--matcha);cursor:pointer;margin:0;}
  .settle-check.disabled{background:var(--vermillion-soft);color:var(--muted);cursor:default;}
  .settle-check.disabled input[type="checkbox"]{accent-color:var(--muted);cursor:not-allowed;}
  .settle-arrow{color:var(--muted);}

  .expense-row,.record-row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);gap:10px;}
  .expense-row:last-child,.record-row:last-child{border-bottom:none;}
  .expense-block{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--paper);}
  .expense-block:last-child{margin-bottom:0;}
  .expense-block-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .expense-block .item-actions{flex-direction:row;justify-content:flex-end;margin-top:10px;}
  .expense-meta,.record-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .expense-amount{font-family:var(--font-mono);font-weight:600;white-space:nowrap;}
  .visibility-badge{font-size:10.5px;padding:2px 8px;border-radius:999px;margin-left:6px;}
  .visibility-badge.public{background:#E8EFDD;color:var(--matcha);}
  .visibility-badge.private{background:#F1EAE0;color:var(--muted);}

  .empty-state{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px;}
  .message{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .message.error{background:#FBEAE7;color:var(--danger);}
  .message.success{background:#E8EFDD;color:var(--matcha);}

  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{max-width:380px;width:100%;background:var(--paper-card);border:1px solid var(--border);border-radius:18px;padding:34px 28px;}
  .auth-card h1{text-align:center;margin-bottom:4px;}
  .auth-card .subtitle{text-align:center;}
  .auth-toggle{text-align:center;font-size:13px;margin-top:14px;color:var(--muted);}
  .auth-toggle a{cursor:pointer;text-decoration:underline;}

  .trip-code{font-family:var(--font-mono);font-size:12.5px;background:var(--paper);border:1px dashed var(--border);padding:6px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);margin-bottom:18px;max-width:100%;flex-wrap:wrap;word-break:break-all;}

  /* 共同行程 / 私人行程 兩欄排版：主行程在左邊，私人行程在旁邊（側欄） */
  .items-columns{display:flex;gap:14px;align-items:flex-start;}
  .items-columns .items-main{flex:1;min-width:0;}
  .items-columns .items-side{flex:0 0 42%;min-width:150px;max-width:260px;border-left:2px dashed var(--border);padding-left:14px;}
  .items-side-head{font-size:11.5px;letter-spacing:.04em;color:var(--matcha);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:4px;}
  .item-row.item-row-private{background:#FBF8F1;border-radius:8px;padding:9px 8px;border-bottom:1px dashed var(--border);}
  .item-private-tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--matcha);background:#E8EFDD;padding:1px 7px;border-radius:999px;margin-top:4px;}
  .private-visibility-box{background:var(--paper);}
  @media (max-width:640px){
    .items-columns{flex-direction:column;}
    .items-columns .items-side{flex:1;max-width:none;border-left:none;border-top:2px dashed var(--border);padding-left:0;padding-top:10px;margin-top:4px;}
  }

  .pack-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);}
  .pack-row:last-child{border-bottom:none;}
  .pack-row.packed .pack-item-name{text-decoration:line-through;color:var(--muted);}
  .pack-check{width:20px;height:20px;accent-color:var(--matcha);cursor:pointer;flex-shrink:0;}
  .pack-item-name{flex:1;min-width:0;word-break:break-word;font-size:13.5px;}
  .pack-progress{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .pack-category-block{margin-bottom:16px;}
  .pack-category-block:last-child{margin-bottom:0;}
  .pack-category-title{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:6px;margin-bottom:2px;}
  .pack-category-title .pack-category-count{font-weight:400;font-size:11.5px;opacity:.75;}
  .pack-row.pack-row-colored{border-left:3px solid transparent;padding-left:8px;}
  .pack-category-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink);}

  @media (max-width:600px){
    .container{padding:20px 12px 60px;}
    .field-row{flex-direction:column;gap:0;}
  }
</style>
</head>
<body>
<div id="topBar" class="top-bar hidden">
  <div class="brand"><span class="stamp">旅</span> 一起去旅行</div>
  <div class="user-info">
    <button class="profile-trigger" id="profileBtn"></button>
    <button id="logoutBtn" class="ghost">登出</button>
  </div>
</div>
<div id="root"></div>

<script>
/* ============================================================
   把這裡換成你自己在 Firebase Console 拿到的 firebaseConfig
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAtMm_FyE_wlduD-T-dpGJSJTduoJhhDi4",
  authDomain: "travel-app-d60a2.firebaseapp.com",
  projectId: "travel-app-d60a2",
  storageBucket: "travel-app-d60a2.firebasestorage.app",
  messagingSenderId: "421219269881",
  appId: "1:421219269881:web:64af48d9def28394857628",
  measurementId: "G-QRTP15451X"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ------------------------------------------------------------
// 全域狀態
// ------------------------------------------------------------
let currentUser = null;
let currentProfile = null;
let currentTrip = null;
let currentMembers = [];
let activeTab = 'itinerary';
let authMode = 'login';
let weatherCache = null; // {tripId, days:[...]}
let ratesCache = null; // {rates:{...}, fetchedAt}
const tabDataCache = {}; // avoids refetching from Firestore every time you switch tabs
function tabCacheKey(name, extra){ return currentTrip.id + '|' + name + (extra?('|'+extra):''); }
function clearTabCache(name, extra){ delete tabDataCache[tabCacheKey(name, extra)]; }

const root = document.getElementById('root');
const topBar = document.getElementById('topBar');
const profileBtn = document.getElementById('profileBtn');

// ------------------------------------------------------------
// 大頭貼 / 代表色
// ------------------------------------------------------------
const PALETTE = ["#C1440E","#1B3A4B","#6E7F3C","#8B5E3C","#3E7CB1","#B3261E","#4C8C6B","#8B5A82"];
const DEFAULT_AVATAR = './LOGOJ-4.png';
function avatarSrc(member){ return (member && member.avatar) ? member.avatar : DEFAULT_AVATAR; }
function avatarChipHTML(member, size){
  const s = size || 20;
  return `<img class="avatar-chip" src="${avatarSrc(member)}" style="width:${s}px;height:${s}px;">`;
}
function memberOf(uid){ return currentMembers.find(m=>m.uid===uid); }
function colorOf(profile){
  if(profile && profile.color) return profile.color;
  const name = (profile && (profile.displayName||profile.email)) || '';
  let h = 0;
  for(let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) % 997; }
  return PALETTE[h % PALETTE.length];
}
function renderTopBar(){
  if(!currentProfile) return;
  profileBtn.innerHTML = `<img class="avatar-mini" src="${avatarSrc(currentProfile)}">`;
  profileBtn.innerHTML += `<span>${esc(currentProfile.displayName || currentProfile.email)}</span>`;
}
function openProfileModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const initialColor = colorOf(currentProfile);
  const takenColors = currentMembers.filter(m=>!isMe(m.uid) && m.color).map(m=>m.color);
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-head">
        <h3>編輯個人資料</h3>
        <button class="modal-close" id="closeProfileModal">✕</button>
      </div>
      <div class="avatar-edit">
        <div class="avatar-preview" id="avatarPreview">
          <img src="${avatarSrc(currentProfile)}">
        </div>

            return `<button type="button" class="color-swatch ${isMine?'selected':''} ${disabled?'taken':''}" data-color="${c}" style="background:${c}" ${disabled?'disabled title="這個顏色已經被其他團員用了"':''}></button>`;
          }).join('')}

  document.getElementById('chooseAvatarBtn').onclick = ()=>document.getElementById('avatarInput').click();

    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 320;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        newAvatar = canvas.toDataURL('image/jpeg', 0.82);
        document.getElementById('avatarPreview').innerHTML = `<img src="${newAvatar}">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('colorPicker').querySelectorAll('.color-swatch:not([disabled])').forEach(sw=>{
    sw.onclick = ()=>{
      selectedColor = sw.dataset.color;
      document.getElementById('colorPicker').querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
    };
  });

  document.getElementById('saveProfileBtn').onclick = async ()=>{
    const btn = document.getElementById('saveProfileBtn');
    const displayName = document.getElementById('profileNameInput').value.trim();
    if(!displayName){ alert('請輸入暱稱'); return; }
    btn.disabled = true; btn.textContent = '儲存中…';
    try{
      await db.collection('users').doc(currentUser.uid).update({
        displayName, avatar: newAvatar || null, color: selectedColor
      });
      currentProfile.displayName = displayName;
      currentProfile.avatar = newAvatar || null;
      currentProfile.color = selectedColor;
      const meInMembers = currentMembers.find(m=>isMe(m.uid));
      if(meInMembers){ meInMembers.displayName = displayName; meInMembers.avatar = newAvatar || null; meInMembers.color = selectedColor; }
      renderTopBar();
      overlay.remove();
      if(currentTrip) renderTripDetailView(); else renderTripsView();
    }catch(e){
      alert('更新失敗：'+e.message);
      btn.disabled = false; btn.textContent = '儲存';
    }
  };
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('zh-TW', {maximumFractionDigits:0}); }
function nameOf(uid){ const m = currentMembers.find(m=>m.uid===uid); return m ? m.displayName : '未知成員'; }
function isMe(uid){ return currentUser && uid === currentUser.uid; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDaysToDateStr(dateStr, delta){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.toISOString().slice(0,10);
}
// 猜一個「新增一天」時最合理的預設日期：接續在已建立天數的最後一天之後；
// 如果還沒建立任何一天，就從行程的出發日開始。只是預設值，不會限制使用者改選別的日期。
function suggestNextDayDate(days){
  if(days && days.length>0){
    const maxDate = days.reduce((max,d)=> (d.date && d.date>max) ? d.date : max, days[0].date || '');
    if(maxDate) return addDaysToDateStr(maxDate, 1);
  }
  if(currentTrip && currentTrip.startDate) return currentTrip.startDate;
  return todayStr();
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
const WEEKDAYS = ['日','一','二','三','四','五','六'];
function weekdayLabel(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return '週' + WEEKDAYS[d.getDay()];
}

// 換算成新台幣：非台幣時用匯率（1 單位外幣 = ? 台幣）換算，台幣本身視為匯率 1
function toTWD(amount, code, rate){
  if(!code || code==='TWD') return Number(amount)||0;
  const r = Number(rate);
  return (Number(amount)||0) * (r>0 ? r : 1);
}

}

auth.onAuthStateChanged(async (user)=>{
  currentUser = user;
  if(user){
    topBar.classList.remove('hidden');
    try{
      const snap = await db.collection('users').doc(user.uid).get();
      currentProfile = snap.exists ? snap.data() : {email:user.email, displayName:user.email.split('@')[0]};
    }catch(e){
      currentProfile = {email:user.email, displayName:user.email.split('@')[0]};
    }
    renderTopBar();
    currentTrip = null;
    if(currentProfile.defaultTripId){
      let opened = false;
      try{ opened = await openTrip(currentProfile.defaultTripId); }catch(e){ opened = false; }
      if(!opened){
        // 預設行程可能被刪除了，或你已經不是團員了，自動清掉這個設定避免下次又卡住
        try{ await db.collection('users').doc(user.uid).update({ defaultTripId: firebase.firestore.FieldValue.delete() }); }catch(e){}
        delete currentProfile.defaultTripId;
        await renderTripsView();
      }
    } else {
      await renderTripsView();
    }
  } else {
    topBar.classList.add('hidden');
    authMode = 'login';
    renderAuthView();
  }
});

async function openTrip(tripId){
  const snap = await db.collection('trips').doc(tripId).get();
  if(!snap.exists) return false;
  const tripData = {id:snap.id, ...snap.data()};
  if(!tripData.members || !tripData.members.includes(currentUser.uid)) return false; // 不是這個行程的團員了
  currentTrip = tripData;
  const uniqueUids = [...new Set(currentTrip.members)];
  // 平行抓取所有團員資料，而不是一個一個等，減少開啟行程時的等待時間
  const memberSnaps = await Promise.all(uniqueUids.map(uid=>db.collection('users').doc(uid).get()));
  currentMembers = uniqueUids.map((uid,i)=>{
    const uSnap = memberSnaps[i];
    const data = uSnap.exists ? uSnap.data() : {};
    return {
      uid,
      ...data,
      displayName: data.displayName || data.email || '未命名成員'
    };
  });
  activeTab = 'overview';
  await renderTripDetailView();
  return true;
}

function mountItemDetail(collectionRef, item, scopeEl){
  const detailEl = scopeEl.querySelector(`[data-detail-for="${item.id}"]`);
  if(!detailEl) return;
  detailEl.innerHTML = itemDetailHTML(item);
  bindItemDetailHandlers(collectionRef, item, scopeEl);
}

function bindItemDetailHandlers(collectionRef, item, scopeEl){
  const detailEl = scopeEl.querySelector(`[data-detail-for="${item.id}"]`);
  if(!detailEl) return;

  function refresh(){ mountItemDetail(collectionRef, item, scopeEl); }

  detailEl.querySelectorAll('[data-del-memo]').forEach(btn=>{
    btn.onclick = async ()=>{
      item.memos = (item.memos||[]).filter(m=>m.id!==btn.dataset.delMemo);
      refresh();
      try{ await collectionRef.doc(item.id).update({memos:item.memos}); }
      catch(err){ alert('刪除備忘錄失敗，請檢查網路連線：'+err.message); }
    };
  });
  detailEl.querySelectorAll('[data-del-link]').forEach(btn=>{
    btn.onclick = async ()=>{
      item.links = (item.links||[]).filter(l=>l.id!==btn.dataset.delLink);
      refresh();
      try{ await collectionRef.doc(item.id).update({links:item.links}); }
      catch(err){ alert('刪除連結失敗，請檢查網路連線：'+err.message); }
    };
  });
  const memoForm = detailEl.querySelector('[data-add-memo]');
  let pendingMemoImage = null;
  const memoImgInput = memoForm.querySelector('.detail-memo-img-input');
  const memoPreviewWrap = memoForm.querySelector('.detail-img-preview-wrap');
  const memoPreviewImg = memoForm.querySelector('.detail-img-preview');
  memoImgInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        pendingMemoImage = canvas.toDataURL('image/jpeg', 0.7);
        memoPreviewImg.src = pendingMemoImage;
        memoPreviewWrap.classList.remove('hidden');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  memoForm.querySelector('.detail-img-clear').onclick = ()=>{
    pendingMemoImage = null;
    memoImgInput.value = '';
    memoPreviewWrap.classList.add('hidden');
  };
  memoForm.onsubmit = async (e)=>{
    e.preventDefault();
    const input = memoForm.querySelector('.detail-memo-input');
    const text = input.value.trim();
    if(!text && !pendingMemoImage) return;
    const newMemo = {
      id:genId(), text,
      authorUid: currentUser.uid,
      authorName: (currentProfile && (currentProfile.displayName || currentProfile.email)) || '未知成員'
    };
    if(pendingMemoImage) newMemo.image = pendingMemoImage;
    item.memos = [...(item.memos||[]), newMemo];
    refresh();
    try{ await collectionRef.doc(item.id).update({memos:item.memos}); }
    catch(err){ alert('儲存備忘錄失敗，請檢查網路連線：'+err.message); }
  };
  const linkForm = detailEl.querySelector('[data-add-link]');
  linkForm.onsubmit = async (e)=>{
    e.preventDefault();
    const label = linkForm.querySelector('.detail-link-label').value.trim();
    const url = linkForm.querySelector('.detail-link-url').value.trim();
    if(!url) return;
    item.links = [...(item.links||[]), {id:genId(), label, url}];
    refresh();
    try{ await collectionRef.doc(item.id).update({links:item.links}); }
    catch(err){ alert('儲存連結失敗，請檢查網路連線：'+err.message); }
  };
}

// ---------------- 天氣預報（Open-Meteo，免金鑰） ----------------
function weatherEmoji(code){
  if(code===0) return '☀️';
  if([1,2].includes(code)) return '🌤️';
  if(code===3) return '☁️';
  if([45,48].includes(code)) return '🌫️';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if([71,73,75,77,85,86].includes(code)) return '🌨️';
  if([95,96,99].includes(code)) return '⛈️';
  return '🌡️';
}
function weatherText(code){
  const map = {
    0:'晴朗', 1:'晴時多雲', 2:'多雲時晴', 3:'陰天',
    45:'有霧', 48:'霧凇',
    51:'毛毛雨', 53:'毛毛雨', 55:'毛毛雨', 56:'凍雨', 57:'凍雨',
    61:'小雨', 63:'中雨', 65:'大雨', 66:'凍雨', 67:'凍雨',
    71:'小雪', 73:'中雪', 75:'大雪', 77:'雪粒',
    80:'陣雨', 81:'陣雨', 82:'強陣雨',
    85:'陣雪', 86:'強陣雪',
    95:'雷雨', 96:'雷雨帶冰雹', 99:'雷雨帶冰雹'
  };
  return map[code] || '天氣不明';
}
const COUNTRY_NAMES_ZH_HANT = {
  JP:'日本', KR:'韓國', TW:'台灣', CN:'中國', HK:'香港', MO:'澳門',
  US:'美國', CA:'加拿大', GB:'英國', FR:'法國', DE:'德國', IT:'義大利',
  ES:'西班牙', AU:'澳洲', NZ:'紐西蘭', TH:'泰國', VN:'越南', SG:'新加坡',
  MY:'馬來西亞', PH:'菲律賓', ID:'印尼', IN:'印度', AE:'阿聯', TR:'土耳其',
  NL:'荷蘭', CH:'瑞士', AT:'奧地利', BE:'比利時', PT:'葡萄牙', GR:'希臘',
  CZ:'捷克', PL:'波蘭', SE:'瑞典', NO:'挪威', DK:'丹麥', FI:'芬蘭',
  RU:'俄羅斯', MX:'墨西哥', BR:'巴西', AR:'阿根廷', EG:'埃及', ZA:'南非'
};
async function geocodeCity(name){
  // 不用 API 的 language=zh（會回傳簡體中文），改用使用者自己輸入的名稱 + 自己維護的繁體國名對照表
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1`);
  const data = await res.json();
  if(!data.results || data.results.length===0) return null;
  const r = data.results[0];
  const countryZh = COUNTRY_NAMES_ZH_HANT[r.country_code] || '';
  return { name: countryZh ? `${name}，${countryZh}` : name, lat:r.latitude, lon:r.longitude };
}
async function fetchWeatherData(){
  if(weatherCache && weatherCache.tripId===currentTrip.id) return weatherCache;
  // past_days 涵蓋最近幾天，forecast_days 涵蓋未來 16 天，這樣「今天」跟大部分想查的日期都查得到
  const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentTrip.destinationLat}&longitude=${currentTrip.destinationLon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&past_days=5&forecast_days=16`);
  const data = await res.json();
  const dates = data.daily.time, codes = data.daily.weathercode, maxT = data.daily.temperature_2m_max, minT = data.daily.temperature_2m_min;
  const allDays = dates.map((dt,i)=>({
    date: dt,
    dateLabel: dt.slice(5).replace('-','/')+' '+weekdayLabel(dt),
    emoji: weatherEmoji(codes[i]),
    text: weatherText(codes[i]),
    max: Math.round(maxT[i]),
    min: Math.round(minT[i])
  }));
  const byDate = {};
  allDays.forEach(d=>{ byDate[d.date] = d; });
  const tripDays = allDays.filter(d=>d.date>=currentTrip.startDate && d.date<=currentTrip.endDate);
  weatherCache = {
    tripId: currentTrip.id, allDays, byDate, tripDays,
    minDate: allDays[0] ? allDays[0].date : todayStr(),
    maxDate: allDays[allDays.length-1] ? allDays[allDays.length-1].date : todayStr()
  };
  return weatherCache;
}
async function renderWeatherSection(){

    el.innerHTML = `
      <div class="card">
        <h2>🌤️ 天氣預報</h2>
        <p class="subtitle" style="margin-bottom:12px">設定目的地城市，就能看到行程期間的天氣預報</p>
        <form id="setDestinationForm" style="display:flex;gap:8px;">

        await db.collection('trips').doc(currentTrip.id).update({
          destinationCity: geo.name, destinationLat: geo.lat, destinationLon: geo.lon
        });

        weatherCache = null;

      }catch(err){
        alert('設定失敗，請檢查網路連線：'+err.message);
        btn.disabled = false; btn.textContent = '設定';
      }
    };
    return;
  }

  el.innerHTML = `
    <div class="card">
      <div class="card-row" style="align-items:flex-start;">
        <h2 style="margin-bottom:0">🌤️ ${esc(currentTrip.destinationCity)} 天氣預報</h2>
        <button class="btn-danger" id="changeDestinationBtn" style="flex-shrink:0">更改</button>
      </div>
      <div id="weatherBody" style="margin-top:10px;"><div class="empty-state">載入中…</div></div>
    </div>
  `;
  document.getElementById('changeDestinationBtn').onclick = async ()=>{
    if(!confirm('確定要清除目前的目的地設定嗎？')) return;
    await db.collection('trips').doc(currentTrip.id).update({
      destinationCity: firebase.firestore.FieldValue.delete(),
      destinationLat: firebase.firestore.FieldValue.delete(),
      destinationLon: firebase.firestore.FieldValue.delete()
    });
    delete currentTrip.destinationCity; delete currentTrip.destinationLat; delete currentTrip.destinationLon;
    weatherCache = null;
    renderWeatherSection();
  };
  const bodyEl = document.getElementById('weatherBody');
  try{
    const wdata = await fetchWeatherData();
    bodyEl.innerHTML = `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
        <div class="date-wrap" style="flex:1;min-width:140px;">
          <input type="date" id="weatherDatePick" value="${todayStr()}" min="${wdata.minDate}" max="${wdata.maxDate}">
        </div>
        <button type="button" class="btn btn-outline" id="weatherTodayBtn" style="flex-shrink:0;">今天</button>
      </div>
      <div id="weatherSingleDay"></div>
      ${wdata.tripDays.length>0 ? `
        <p class="subtitle" style="margin:14px 0 8px;">行程期間預報</p>
        <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;">
          ${wdata.tripDays.map(d=>`
            <div style="flex:0 0 auto;min-width:74px;text-align:center;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:10px 8px;">
              <div style="font-size:11px;color:var(--muted);">${d.dateLabel}</div>
              <div style="font-size:24px;margin:4px 0;">${d.emoji}</div>
              <div style="font-size:12.5px;font-family:var(--font-mono);">${d.max}°/${d.min}°</div>
            </div>
          `).join('')}
        </div>
      ` : `<div class="empty-state" style="margin-top:10px;">目前查得到的預報還沒到你的旅行日期，出發前幾天再回來看看吧</div>`}
    `;
    function renderSingleDay(dateStr){
      const singleEl = document.getElementById('weatherSingleDay');
      const d = wdata.byDate[dateStr];
      if(!d){
        singleEl.innerHTML = `<div class="empty-state" style="padding:14px 0;">這天超出可查詢的範圍（大約前 5 天到後 16 天）</div>`;
        return;
      }
      singleEl.innerHTML = `
        <div style="display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:14px;">
          <div style="font-size:40px;">${d.emoji}</div>
          <div>
            <div style="font-weight:600;font-size:14px;">${d.dateLabel} · ${esc(d.text)}</div>
            <div style="font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);margin-top:2px;">最高 ${d.max}° / 最低 ${d.min}°</div>
          </div>
        </div>
      `;
    }
    const datePickEl = document.getElementById('weatherDatePick');
    datePickEl.onchange = ()=>renderSingleDay(datePickEl.value);
    document.getElementById('weatherTodayBtn').onclick = ()=>{
      const t = todayStr();
      datePickEl.value = t;
      renderSingleDay(t);
    };
    renderSingleDay(datePickEl.value);
  }catch(err){
    bodyEl.innerHTML = `<div class="empty-state">天氣資料載入失敗：${esc(err.message)}</div>`;
  }
}

// ---------------- 匯率換算小工具（open.er-api.com，免金鑰） ----------------
async function fetchRates(){
  const now = Date.now();
  if(ratesCache && (now - ratesCache.fetchedAt) < 6*60*60*1000) return ratesCache.rates;
  const res = await fetch('https://open.er-api.com/v6/latest/TWD');
  const data = await res.json();
  if(data.result !== 'success') throw new Error('匯率資料取得失敗');
  ratesCache = {rates:data.rates, fetchedAt:now};
  return data.rates;
}
async function fillLiveRate(currencyEl, rateEl, btn){
  const code = currencyEl.value;
  if(code==='TWD'){ alert('新台幣不需要填匯率'); return; }
  if(code==='OTHER'){ alert('這個幣別沒有即時匯率，請自行輸入'); return; }
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = '抓取中…';
  try{
    const rates = await fetchRates();
    const rate = rates[code];

function fmtNum(n, decimals){
  return Number(n||0).toLocaleString('zh-TW', {maximumFractionDigits: decimals==null?2:decimals});
}
// 安全的四則運算計算機（只允許數字、+ - * / ( ). ，不使用 eval）
function safeEval(exprRaw){
  const expr = (exprRaw||'').replace(/\s+/g,'');
  if(expr==='') return null;
  if(!/^[0-9+\-*/().]*$/.test(expr)) throw new Error('包含不支援的字元');
  let i = 0;
  function parseExpr(){
    let v = parseTerm();
    while(expr[i]==='+' || expr[i]==='-'){
      const op = expr[i++];
      const t = parseTerm();
      v = op==='+' ? v+t : v-t;
    }
    return v;
  }
  function parseTerm(){
    let v = parseFactor();
    while(expr[i]==='*' || expr[i]==='/'){
      const op = expr[i++];
      const f = parseFactor();
      v = op==='*' ? v*f : v/f;
    }
    return v;
  }
  function parseFactor(){
    if(expr[i]==='('){ i++; const v = parseExpr(); if(expr[i]===')') i++; return v; }
    if(expr[i]==='-'){ i++; return -parseFactor(); }
    if(expr[i]==='+'){ i++; return parseFactor(); }
    const start = i;
    while(i<expr.length && /[0-9.]/.test(expr[i])) i++;
    if(start===i) throw new Error('格式錯誤');
    return parseFloat(expr.slice(start,i));
  }
  const result = parseExpr();
  if(i!==expr.length) throw new Error('格式錯誤');
  if(!isFinite(result)) throw new Error('計算錯誤');
  return result;
}

function bindCurrencyTool(scopeEl){
  const card = scopeEl.querySelector('#currencyToolCard');
  if(!card) return;
  const displayEl = card.querySelector('#ctDisplay');
  const currencyEl = card.querySelector('#ctCurrency');
  const resultEl = card.querySelector('#ctResult');
  const metaEl = card.querySelector('#ctMeta');
  let expr = '1';

  function renderDisplay(){
    displayEl.textContent = expr === '' ? '0' : expr;
  }

  async function update(){
    resultEl.textContent = '載入匯率中…';
    metaEl.textContent = '';
    try{
      const rates = await fetchRates();
      const code = currencyEl.value;
      const direction = card.querySelector('input[name="ctDirection"]:checked').value;
      if(code==='OTHER'){ resultEl.textContent = '這個幣別沒有即時匯率，請自行輸入'; return; }
      const rate = rates[code]; // 1 台幣 = rate[code] 個這個幣別
      if(!rate){ resultEl.textContent = '查不到這個幣別的匯率'; return; }
      let raw;
      try{ raw = safeEval(expr); }
      catch(err){ resultEl.textContent = '算式還沒完成'; return; }
      if(raw===null || !isFinite(raw)){ resultEl.textContent = '請按數字鍵輸入金額'; return; }
      if(direction==='toTWD'){
        const twd = raw / rate;
        resultEl.textContent = `= ${fmtNum(raw)} ${code} ≈ NT$ ${fmt(twd)}`;
      } else {
        const foreign = raw * rate;
        resultEl.textContent = `= NT$ ${fmtNum(raw)} ≈ ${fmtNum(foreign)} ${code}`;
      }
      const oneUnitTWD = 1/rate;
      metaEl.textContent = `參考匯率：1 ${code} ≈ NT$ ${oneUnitTWD.toFixed(3)}（僅供參考，非即時交易匯率）`;
    }catch(err){
      resultEl.textContent = '匯率載入失敗，請檢查網路連線';
    }
  }

  card.querySelectorAll('.ct-key').forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.ck;
      if(k==='C'){ expr = ''; }
      else if(k==='⌫'){ expr = expr.slice(0,-1); }
      else { expr += k; }
      renderDisplay();
      update();
    };
  });
  currencyEl.onchange = update;
  card.querySelectorAll('input[name="ctDirection"]').forEach(r=>{ r.onchange = update; });

  renderDisplay();
  update();
}

// ---------------- 打包清單（僅自己可見的個人物品清單，支援分類） ----------------
const DEFAULT_PACK_CATEGORIES = [
  '📄 出入境用品',
  '🔌 電子用品',
  '🧴 盥洗用品',
  '👕 衣物',
  '💊 藥品／醫療用品',
  '🩸 生理用品',
  '🎁 伴手禮／購物清單',
  '💎 貴重物品',
  '📦 其他'
];
const NEW_CATEGORY_VALUE = '__new_category__';

// 預設分類給固定的、好記的顏色；自訂分類則用名稱算出一個固定顏色（同一個名字每次都會拿到同一個顏色）
const CATEGORY_COLOR_MAP = {
  '📄 出入境用品':       {bg:'#E3ECF5', text:'#2C5C8A'},
  '🔌 電子用品':         {bg:'#EDEAF5', text:'#5B4B8A'},
  '🧴 盥洗用品':         {bg:'#E1F0EC', text:'#2E7D6B'},
  '👕 衣物':             {bg:'#FDEAF0', text:'#B23A6B'},
  '💊 藥品／醫療用品':   {bg:'#FBEAEA', text:'#B3261E'},
  '🩸 生理用品':         {bg:'#F3E8F7', text:'#7A3E9D'},
  '🎁 伴手禮／購物清單': {bg:'#FDF1E3', text:'#B5651D'},
  '💎 貴重物品':         {bg:'#FFF6D9', text:'#8A6D00'},
  '📦 其他':             {bg:'#EFEAE0', text:'#8A7A5C'}
};
const CATEGORY_COLOR_FALLBACK_PALETTE = [
  {bg:'#E3ECF5', text:'#2C5C8A'}, {bg:'#EDEAF5', text:'#5B4B8A'},
  {bg:'#E1F0EC', text:'#2E7D6B'}, {bg:'#FDEAF0', text:'#B23A6B'},
  {bg:'#FBEAEA', text:'#B3261E'}, {bg:'#F3E8F7', text:'#7A3E9D'},
  {bg:'#FDF1E3', text:'#B5651D'}, {bg:'#FFF6D9', text:'#8A6D00'},
  {bg:'#E4F0FA', text:'#1B6FA8'}, {bg:'#EAF5E0', text:'#4C8C2E'}
];
function categoryColor(name){
  if(CATEGORY_COLOR_MAP[name]) return CATEGORY_COLOR_MAP[name];
  let h = 0;
  for(let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) % 997; }
  return CATEGORY_COLOR_FALLBACK_PALETTE[h % CATEGORY_COLOR_FALLBACK_PALETTE.length];
}

function packCategorySelectOptionsHTML(categories, selected){
  const opts = categories.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
  return opts + `<option value="${NEW_CATEGORY_VALUE}">＋ 新增自訂類別…</option>`;
}

async function renderPackingSection(el){
  el.innerHTML = `
    <div class="card">
      <h2>🎒 我的打包清單</h2>
      <p class="subtitle" style="margin-bottom:10px;">只有你自己看得到，勾選代表已經帶了，可以自訂分類</p>
      <div id="packProgress" class="pack-progress"></div>
      <div id="packList"><div class="empty-state" style="padding:14px 0;">載入中…</div></div>
      <form id="addPackForm" style="margin-top:10px;">
        <div class="field" style="margin-bottom:8px;">
          <select id="packCategorySelect" class="pack-category-select"></select>
        </div>
        <div class="field hidden" id="packNewCategoryWrap" style="margin-bottom:8px;">
          <input type="text" id="packNewCategoryInput" placeholder="輸入新的類別名稱，例如：登山用品" maxlength="20" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;">
        </div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="packItemInput" placeholder="例如：護照、充電線、雨傘…" style="flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;" required maxlength="40">
          <button type="submit" class="btn btn-outline" style="flex-shrink:0;">新增</button>
        </div>
      </form>
    </div>
  `;

  const itemsCacheKey = tabCacheKey('packing');
  const catCacheKey = tabCacheKey('packingCategories');
  let items = tabDataCache[itemsCacheKey];
  let customCategories = tabDataCache[catCacheKey];
  const collectionRef = db.collection('trips').doc(currentTrip.id).collection('packingItems');
  const catDocRef = db.collection('trips').doc(currentTrip.id).collection('packingCategories').doc(currentUser.uid);

  if(!items){
    try{
      const snap = await collectionRef.where('userId','==', currentUser.uid).orderBy('createdAt','asc').get();
      items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(err){
      items = [];
    }
    tabDataCache[itemsCacheKey] = items;
  }
  if(!customCategories){
    try{
      const catSnap = await catDocRef.get();
      customCategories = catSnap.exists ? (catSnap.data().names || []) : [];
    }catch(err){
      customCategories = [];
    }
    tabDataCache[catCacheKey] = customCategories;
  }

  // 若舊資料裡有用過、但還沒被存進自訂類別清單的分類名稱（例如舊版沒有分類欄位前建立的項目），也一併補進選項，避免漏掉
  function allCategories(){
    const known = new Set([...DEFAULT_PACK_CATEGORIES, ...customCategories]);
    const extra = [];
    items.forEach(it=>{
      const c = it.category || '📦 其他';
      if(!known.has(c)){ known.add(c); extra.push(c); }
    });
    return [...DEFAULT_PACK_CATEGORIES, ...customCategories, ...extra];
  }

  function populateCategorySelect(selectedValue){
    const selectEl = document.getElementById('packCategorySelect');
    if(!selectEl) return;
    selectEl.innerHTML = packCategorySelectOptionsHTML(allCategories(), selectedValue);
  }
  populateCategorySelect(DEFAULT_PACK_CATEGORIES[0]);

  const categorySelectEl = document.getElementById('packCategorySelect');
  const newCategoryWrap = document.getElementById('packNewCategoryWrap');
  const newCategoryInput = document.getElementById('packNewCategoryInput');
  categorySelectEl.onchange = ()=>{
    newCategoryWrap.classList.toggle('hidden', categorySelectEl.value !== NEW_CATEGORY_VALUE);
    if(categorySelectEl.value === NEW_CATEGORY_VALUE) newCategoryInput.focus();
  };

  function renderList(){
    const listEl = document.getElementById('packList');
    const progressEl = document.getElementById('packProgress');
    if(!listEl) return;
    const packedCount = items.filter(it=>it.packed).length;
    progressEl.textContent = items.length===0 ? '' : `已打包 ${packedCount} / ${items.length} 項`;
    if(items.length===0){
      listEl.innerHTML = `<div class="empty-state" style="padding:14px 0;">還沒有加入任何物品，開始列你的打包清單吧</div>`;
      return;
    }
    // 依分類分組，順序：預設分類 → 自訂分類 → 其他曾經用過的分類；分類內依加入時間排序
    const order = allCategories();
    const grouped = {};
    items.forEach(it=>{
      const c = it.category || '📦 其他';
      grouped[c] = grouped[c] || [];
      grouped[c].push(it);
    });
    listEl.innerHTML = order.filter(c=>grouped[c] && grouped[c].length>0).map(cat=>{
      const catItems = grouped[cat];
      const packedInCat = catItems.filter(it=>it.packed).length;
      const color = categoryColor(cat);
      return `
        <div class="pack-category-block" data-pack-cat="${esc(cat)}">
          <div class="pack-category-title" style="background:${color.bg};color:${color.text};">
            <span>${esc(cat)}</span>
            <span class="pack-category-count">${packedInCat} / ${catItems.length}</span>
          </div>
          ${catItems.map(it=>`
            <div class="pack-row pack-row-colored ${it.packed ? 'packed' : ''}" data-pack-row="${it.id}" style="border-left-color:${color.bg};">
              <input type="checkbox" class="pack-check" data-pack-toggle="${it.id}" style="accent-color:${color.text};" ${it.packed?'checked':''}>
              <span class="pack-item-name">${esc(it.name)}</span>
              <button class="btn-danger" data-del-pack="${it.id}">刪除</button>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
    listEl.querySelectorAll('[data-pack-toggle]').forEach(cb=>{
      cb.onchange = async ()=>{
        const id = cb.dataset.packToggle;
        const item = items.find(x=>x.id===id);
        if(!item) return;
        item.packed = cb.checked;
        renderList();
        try{
          await collectionRef.doc(id).update({packed: item.packed});
        }catch(err){
          item.packed = !item.packed;
          renderList();
          alert('更新失敗，請檢查網路連線：'+err.message);
        }
      };
    });
    listEl.querySelectorAll('[data-del-pack]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.delPack;
        try{
          await collectionRef.doc(id).delete();
          items = items.filter(x=>x.id!==id);
          tabDataCache[itemsCacheKey] = items;
          renderList();
        }catch(err){
          alert('刪除失敗，請檢查網路連線：'+err.message);
        }
      };
    });
  }
  renderList();

  document.getElementById('addPackForm').onsubmit = async (e)=>{
    e.preventDefault();
    const input = document.getElementById('packItemInput');
    const name = input.value.trim();
    if(!name) return;
    let category = categorySelectEl.value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try{
      if(category === NEW_CATEGORY_VALUE){
        const typed = newCategoryInput.value.trim();
        if(!typed){ alert('請輸入新的類別名稱'); submitBtn.disabled = false; return; }
        category = typed;
        // 存成這個使用者往後可以重複選用的自訂類別，下次就不用再打一次字
        if(!customCategories.includes(category) && !DEFAULT_PACK_CATEGORIES.includes(category)){
          customCategories = [...customCategories, category];
          tabDataCache[catCacheKey] = customCategories;
          try{
            await catDocRef.set({ names: firebase.firestore.FieldValue.arrayUnion(category) }, {merge:true});
          }catch(err){
            // 類別存檔失敗也不影響這次新增物品，只是下次可能要重打一次類別名稱
          }
        }
      }
      const newItem = {
        name, category, packed:false, userId: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      const ref = await collectionRef.add(newItem);
      items.push({id:ref.id, ...newItem, createdAt:{toDate:()=>new Date()}});
      tabDataCache[itemsCacheKey] = items;
      input.value = '';
      populateCategorySelect(category);
      newCategoryInput.value = '';
      newCategoryWrap.classList.add('hidden');
      renderList();
      input.focus();
    }catch(err){
      alert('新增失敗，請檢查網路連線：'+err.message);
    }finally{
      submitBtn.disabled = false;
    }
  };
}

function formatPostTime(ts){
  if(!ts || typeof ts.toDate !== 'function') return '剛剛發布';
  const d = ts.toDate();
  return d.toLocaleString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}
// 把純文字裡的網址自動轉成可以點擊的連結（先安全跳脫文字，再插入連結標籤，避免 XSS）
function linkifyText(text){
  if(!text) return '';
  const urlRegex = /(https?:\/\/[^\s<>"']+)/gi;
  const trailingPunct = /[.,;:!?)\]}]+$/;
  let result = '';
  let lastIndex = 0;
  let match;
  while((match = urlRegex.exec(text)) !== null){
    let url = match[0];
    let trailing = '';
    const trailMatch = url.match(trailingPunct);
    if(trailMatch){
      trailing = trailMatch[0];
      url = url.slice(0, url.length - trailing.length);
    }
    result += esc(text.slice(lastIndex, match.index));
    result += `<a href="${esc(url)}" target="_blank" rel="noopener">${linkIconHTML(url)}${esc(url)}</a>`;
    result += esc(trailing);
    lastIndex = match.index + match[0].length;
  }
  result += esc(text.slice(lastIndex));
  return result;
}

      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;

  document.querySelectorAll('[data-del-post]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('確定要刪除這篇貼文嗎？')) return;

        await db.collection('trips').doc(currentTrip.id).collection('posts').doc(btn.dataset.delPost).delete();

        renderPostsTab(el);
      }catch(err){
        alert('刪除失敗，請檢查網路連線：'+err.message);
      }

  document.querySelectorAll('[data-edit-post]').forEach(btn=>{
    btn.onclick = ()=>{
      const post = posts.find(x=>x.id===btn.dataset.editPost);

      if(!cardEl) return;
      cardEl.outerHTML = postEditFormHTML(post);
      const formEl = document.querySelector(`.edit-item-form[data-post-row="${post.id}"]`);

      let pendingImage = post.image || null;
      let imageRemoved = false;
      const imgInput = formEl.querySelector('.post-e-img-input');
      const imgPreviewWrap = formEl.querySelector('.post-e-img-preview-wrap');
      const imgPreview = formEl.querySelector('.post-e-img-preview');

      imgInput.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{
          const img = new Image();
          img.onload = ()=>{
            const maxW = 900;
            const scale = Math.min(1, maxW/img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width*scale;
            canvas.height = img.height*scale;
            canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
            pendingImage = canvas.toDataURL('image/jpeg', 0.75);
            imageRemoved = false;
            imgPreview.src = pendingImage;
            imgPreviewWrap.style.display = 'flex';
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
      formEl.querySelector('.post-e-img-clear').onclick = ()=>{
        pendingImage = null;
        imageRemoved = true;
        imgInput.value = '';
        imgPreviewWrap.style.display = 'none';
      };
      formEl.querySelector('.post-e-cancel').onclick = ()=>{ renderPostsTab(el); };

            text,
            editedAt: firebase.firestore.FieldValue.serverTimestamp()
          };

            updateData.image = pendingImage;
          } else if(imageRemoved){
            updateData.image = firebase.firestore.FieldValue.delete();

          clearTabCache('posts');
          renderPostsTab(el);
        }catch(err){
          alert('儲存失敗，請檢查網路連線：'+err.message);
          saveBtn.disabled = false; saveBtn.textContent = '儲存';
        }
      };
    };
  });

    const btn = document.querySelector(`[data-like-post="${postId}"]`);

    const liked = currentUser && likes.includes(currentUser.uid);
    btn.style.color = liked ? 'var(--vermillion)' : 'var(--muted)';
    btn.querySelector('span').textContent = liked ? '❤️' : '🤍';
    btn.querySelector('.post-like-count').textContent = likes.length>0 ? likes.length : '';
  }

    btn.onclick = async ()=>{
      const postId = btn.dataset.likePost;
      const post = posts.find(x=>x.id===postId);
      if(!post) return;
      const likes = post.likes || [];
      const liked = likes.includes(currentUser.uid);
      // 先更新畫面，操作起來更即時，失敗的話再復原
      post.likes = liked ? likes.filter(u=>u!==currentUser.uid) : [...likes, currentUser.uid];
      updateLikeButtonUI(postId, post);
      try{
        await db.collection('trips').doc(currentTrip.id).collection('posts').doc(postId).update({
          likes: liked
            ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
            : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
        });
      }catch(err){
        post.likes = likes; // 復原
        updateLikeButtonUI(postId, post);
        alert('操作失敗，請檢查網路連線：'+err.message);
      }
    };
  });

  function updateCommentToggleUI(postId, post){
    const label = document.querySelector(`[data-toggle-comments="${postId}"] .post-comment-count-label`);

          <span style="font-weight:600;font-size:12.5px;">${esc(c.authorName||'未知成員')}</span>
          <span style="font-size:12.5px;color:var(--ink);margin-left:6px;">${esc(c.text)}</span>
        </div>
        ${isMe(c.authorUid) ? `<button class="btn-danger" data-del-comment="${c.id}">刪除</button>` : ''}
      </div>

  }
  async function loadAndRenderComments(postId, section){
    section.innerHTML = `<div class="empty-state" style="padding:10px 0;font-size:12px;">載入留言中…</div>`;
    let comments;
    try{
      const snap = await db.collection('trips').doc(currentTrip.id).collection('posts').doc(postId).collection('comments').orderBy('createdAt','asc').get();
      comments = snap.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(err){
      section.innerHTML = `<div class="empty-state" style="padding:10px 0;font-size:12px;">留言載入失敗：${esc(err.message)}</div>`;
      return;
    }
    section.innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);">
        <div data-comment-list>
          ${comments.length===0 ? `<div class="empty-state" style="padding:6px 0;font-size:12px;">還沒有留言，第一個留言吧</div>` : comments.map(commentRowHTML).join('')}
        </div>
        <form class="add-comment-form" style="display:flex;gap:6px;margin-top:8px;">
          <input type="text" class="comment-input" placeholder="留個言…" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--paper-card);color:var(--ink);">
          <button type="submit" class="btn btn-outline" style="padding:8px 14px;font-size:12.5px;flex-shrink:0;">送出</button>
        </form>
      </div>
    `;
    section.querySelectorAll('[data-del-comment]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('確定要刪除這則留言嗎？')) return;
        try{
          await db.collection('trips').doc(currentTrip.id).collection('posts').doc(postId).collection('comments').doc(btn.dataset.delComment).delete();
          await db.collection('trips').doc(currentTrip.id).collection('posts').doc(postId).update({
            commentCount: firebase.firestore.FieldValue.increment(-1)
          });
          const post = posts.find(x=>x.id===postId);
          if(post) post.commentCount = Math.max(0, (post.commentCount||0)-1);
          updateCommentToggleUI(postId, post);
          loadAndRenderComments(postId, section);
        }catch(err){
          alert('刪除失敗，請檢查網路連線：'+err.message);
        }
      };
    });
    section.querySelector('.add-comment-form').onsubmit = async (e)=>{
      e.preventDefault();
      const input = section.querySelector('.comment-input');
      const text = input.value.trim();
      if(!text) return;
      const submitBtn = section.querySelector('.add-comment-form button[type="submit"]');
      submitBtn.disabled = true;
      try{
        await db.collection('trips').doc(currentTrip.id).collection('posts').doc(postId).collection('comments').add({
          text,
          authorUid: currentUser.uid,
          authorName: (currentProfile && (currentProfile.displayName || currentProfile.email)) || '未知成員',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection('trips').doc(currentTrip.id).collection('posts').doc(postId).update({
          commentCount: firebase.firestore.FieldValue.increment(1)
        });
        const post = posts.find(x=>x.id===postId);
        if(post) post.commentCount = (post.commentCount||0)+1;
        updateCommentToggleUI(postId, post);
        await loadAndRenderComments(postId, section);
      }catch(err){
        alert('留言失敗，請檢查網路連線：'+err.message);
        submitBtn.disabled = false;
      }
    };
  }
  document.querySelectorAll('[data-toggle-comments]').forEach(btn=>{
    btn.onclick = async ()=>{
      const postId = btn.dataset.toggleComments;
      const section = document.querySelector(`[data-comments-for="${postId}"]`);
      if(!section) return;
      const isHidden = section.classList.contains('hidden');
      if(isHidden){
        section.classList.remove('hidden');
        await loadAndRenderComments(postId, section);
      } else {
        section.classList.add('hidden');
      }
    };
  });
}

// ---------------- 一起出錢（共同分帳） ----------------
function pairwiseDebts(expenses, settlements, members){
  // owed[creditor][debtor] = 這個 debtor 欠這個 creditor 多少錢
  const owed = {};
  function add(creditor, debtor, amt){
    if(creditor===debtor || !amt) return;
    owed[creditor] = owed[creditor] || {};
    owed[creditor][debtor] = (owed[creditor][debtor]||0) + amt;
  }
  expenses.forEach(exp=>{
    const amountTWD = toTWD(exp.amount, exp.currency, exp.exchangeRate);
    if(exp.splitType==='custom' && exp.customSplits){
      const totalShare = Object.values(exp.customSplits).reduce((s,v)=>s+Number(v),0) || 1;
      Object.entries(exp.customSplits).forEach(([uid,share])=>{
        add(exp.payerId, uid, amountTWD * (Number(share)/totalShare));
      });
    } else {
      const share = amountTWD / exp.splitWith.length;
      exp.splitWith.forEach(uid=>{
        add(exp.payerId, uid, share);
      });
    }
  });
  // 已經打勾確認收到的款項：debtor(fromId) 對 creditor(toId) 的欠款減少
  settlements.forEach(s=>{
    add(s.toId, s.fromId, -s.amount);
  });

  const uids = members.map(m=>m.uid);
  const result = [];
  for(let i=0;i<uids.length;i++){
    for(let j=i+1;j<uids.length;j++){
      const a = uids[i], b = uids[j];
      const bOwesA = (owed[a] && owed[a][b]) || 0;
      const aOwesB = (owed[b] && owed[b][a]) || 0;
      const net = Math.round((bOwesA - aOwesB) * 100) / 100;
      if(net > 0.5){
        result.push({from:b, to:a, amount:Math.round(net)});
      } else if(net < -0.5){
        result.push({from:a, to:b, amount:Math.round(-net)});
      }
    }
  }
  return result;
}

      block.outerHTML = `
        <div class="edit-item-form" data-exp-row="${exp.id}">
          <div class="field-row">
            <div class="field" style="flex:2"><label>項目</label><input type="text" class="exp-e-title" value="${esc(exp.title)}" required></div>
            <div class="field"><label>金額</label><input type="number" class="exp-e-amount" min="1" step="0.01" value="${exp.amount}" required></div>
          </div>
          <div class="field-row">
            <div class="field"><label>幣別</label>${currencySelectHTML(exp.currency||'TWD', 'exp-e-currency')}</div>
              <div class="field">
              <label>匯率（1 單位 = ? 台幣）</label>
              <div style="display:flex;gap:6px;">
                <input type="number" class="exp-e-rate" min="0" step="0.0001" value="${exp.currency && exp.currency!=='TWD' ? (exp.exchangeRate||'') : ''}" ${(!exp.currency || exp.currency==='TWD')?'disabled':''} placeholder="1" style="flex:1;">
                <button type="button" class="btn btn-outline exp-e-rate-live" style="flex-shrink:0;padding:8px 12px;font-size:12.5px;white-space:nowrap;">抓即時匯率</button>
              </div>
            </div>
          </div>
          <div class="field exp-e-other-field ${exp.currency==='OTHER'?'':'hidden'}"><label>幣別名稱</label><input type="text" class="exp-e-other" value="${esc(exp.customCurrencyName||'')}" placeholder="例如：越南盾（現金）、點數…" maxlength="20"></div>
          <div class="field-row">
            <div class="field"><label>誰先付的</label><select class="exp-e-payer">${payerOptionsEdit}</select></div>
            <div class="field"><label>日期</label><div class="date-wrap"><input type="date" class="exp-e-date" value="${exp.date}" required></div></div>
          </div>
          <div class="field"><label>這筆錢由誰分攤</label>${splitCheckboxesEdit}</div>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-accent exp-e-save" style="flex:1">儲存</button>
            <button type="button" class="btn btn-outline exp-e-cancel">取消</button>
          </div>
        </div>
      `;
      const formEl = expenseListEl.querySelector(`[data-exp-row="${exp.id}"]`);
      const currencyEditEl = formEl.querySelector('.exp-e-currency');
      const rateEditEl = formEl.querySelector('.exp-e-rate');
      const otherFieldEditEl = formEl.querySelector('.exp-e-other-field');
      const otherInputEditEl = formEl.querySelector('.exp-e-other');
      currencyEditEl.onchange = ()=>{
        const isTWD = currencyEditEl.value === 'TWD';
        const isOther = currencyEditEl.value === 'OTHER';
        rateEditEl.disabled = isTWD;
        if(isTWD) rateEditEl.value = '';
        otherFieldEditEl.classList.toggle('hidden', !isOther);
        if(!isOther) otherInputEditEl.value = '';
      };
      formEl.querySelector('.exp-e-rate-live').onclick = ()=>fillLiveRate(currencyEditEl, rateEditEl, formEl.querySelector('.exp-e-rate-live'));
      formEl.querySelector('.exp-e-cancel').onclick = ()=>renderExpensesTab(el);
      formEl.querySelector('.exp-e-save').onclick = async ()=>{
        const title = formEl.querySelector('.exp-e-title').value.trim();
        const amount = Number(formEl.querySelector('.exp-e-amount').value);
        const currency = currencyEditEl.value;
        const exchangeRate = currency==='TWD' ? 1 : Number(rateEditEl.value);
        const customCurrencyName = otherInputEditEl.value.trim();
        const payerId = formEl.querySelector('.exp-e-payer').value;
        const date = formEl.querySelector('.exp-e-date').value;
        const splitWith = [...formEl.querySelectorAll('.edit-split-with:checked')].map(cb=>cb.value);
        if(!title){ alert('請輸入項目名稱'); return; }
        if(!amount || amount<=0){ alert('請輸入正確的金額'); return; }
        if(currency!=='TWD' && (!exchangeRate || exchangeRate<=0)){ alert('請輸入這個幣別對台幣的匯率'); return; }
        if(currency==='OTHER' && !customCurrencyName){ alert('請輸入幣別名稱'); return; }
        if(splitWith.length===0){ alert('至少要選一個人分攤這筆花費'); return; }
        await db.collection('trips').doc(currentTrip.id).collection('expenses').doc(exp.id).update({
          title, amount, currency, exchangeRate, customCurrencyName, payerId, date, splitWith, splitType:'equal'
        });
        clearTabCache('expenses');
        renderExpensesTab(el);
      };
    };
  });

  el.querySelectorAll('[data-mark-paid]').forEach(cb=>{
    cb.onchange = async ()=>{
      if(!cb.checked) return;
      const fromId = cb.dataset.from, toId = cb.dataset.to, amount = Number(cb.dataset.amount);
      if(!confirm(`確定已經收到 ${nameOf(fromId)} 付的 ¥${fmt(amount)} 了嗎？`)){
        cb.checked = false;
        return;
      }
      await db.collection('trips').doc(currentTrip.id).collection('settlements').add({
        fromId, toId, amount, date: todayStr(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      clearTabCache('expenses');
      renderExpensesTab(el);
    };
  });

  el.querySelectorAll('[data-undo-settlement]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('確定要取消這筆付款紀錄嗎？（這筆錢會重新變成還沒付清）')) return;
      await db.collection('trips').doc(currentTrip.id).collection('settlements').doc(btn.dataset.undoSettlement).delete();
      clearTabCache('expenses');
      renderExpensesTab(el);
    };
  });
}

// ---------------- 我的記帳（個人，可選公開） ----------------
async function renderPersonalTab(el){
  const cacheKey = tabCacheKey('personal');
  let myRecords, othersData;
  if(tabDataCache[cacheKey]){
    ({myRecords, othersData} = tabDataCache[cacheKey]);
  } else {
    const others = currentMembers.filter(m=>!isMe(m.uid));
    const [mySnap, ...otherSnaps] = await Promise.all([
      db.collection('trips').doc(currentTrip.id).collection('personalRecords').where('userId','==',currentUser.uid).get(),
      ...others.map(m=>db.collection('trips').doc(currentTrip.id).collection('personalRecords').where('userId','==',m.uid).where('isPublic','==',true).get())
    ]);
    myRecords = mySnap.docs.map(d=>({id:d.id, ...d.data()}));
    othersData = others
      .map((m,i)=>({member:m, records: otherSnaps[i].docs.map(d=>({id:d.id, ...d.data()}))}))
      .filter(o=>o.records.length>0);
    tabDataCache[cacheKey] = {myRecords, othersData};
  }

  el.innerHTML = `
    <div class="card">
      <h2>新增一筆記帳</h2>
      <form id="addRecordForm">
        <div class="field-row">
          <div class="field" style="flex:2"><label>項目</label><input type="text" id="recTitle" placeholder="例如：藥妝戰利品" required></div>
          <div class="field"><label>金額</label><input type="number" id="recAmount" min="1" step="0.01" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>幣別</label>${currencySelectHTML('TWD', '', 'id="recCurrency"')}</div>
          <div class="field">
            <label>匯率（1 單位 = ? 台幣）</label>
            <div style="display:flex;gap:6px;">
              <input type="number" id="recRate" min="0" step="0.0001" placeholder="1" disabled style="flex:1;">
              <button type="button" class="btn btn-outline" id="recRateLiveBtn" style="flex-shrink:0;padding:8px 12px;font-size:12.5px;white-space:nowrap;">抓即時匯率</button>
            </div>
          </div>
        </div>
        <div class="field hidden" id="recOtherCurrencyField"><label>幣別名稱</label><input type="text" id="recOtherCurrency" placeholder="例如：越南盾（現金）、點數…" maxlength="20"></div>
        <div class="field"><label>日期</label><div class="date-wrap"><input type="date" id="recDate" required></div></div>
        <label class="checkbox-row" style="margin-bottom:14px"><input type="checkbox" id="recPublic"> 公開這筆給其他團員看到</label>
        <button type="submit" class="btn btn-accent btn-block">新增記錄</button>
      </form>
    </div>

    <div class="card">
      <h2>我的記帳明細</h2>
      <p class="subtitle">總支出：NT$${fmt(myRecords.reduce((s,r)=>s+toTWD(r.amount, r.currency, r.exchangeRate),0))}</p>
      <div id="myRecordList">
        ${myRecords.length===0 ? `<div class="empty-state">還沒有任何記帳</div>` : myRecords.map(r=>`
          <div class="record-row">
            <div>
              <div>${esc(r.title)}<span class="visibility-badge ${r.isPublic?'public':'private'}">${r.isPublic?'公開':'只有我看得到'}</span></div>
              <div class="record-meta">${r.date}</div>
            </div>
            <div style="text-align:right">
              <div class="expense-amount">${fmtCurrency(r.amount, r.currency, r.customCurrencyName)}</div>
              ${r.currency && r.currency!=='TWD' ? `<div class="record-meta">≈ NT$${fmt(toTWD(r.amount, r.currency, r.exchangeRate))}</div>` : ''}
              <button class="btn-danger" data-toggle-record="${r.id}" data-public="${r.isPublic}">${r.isPublic?'設為不公開':'設為公開'}</button>
              <button class="btn-danger" data-del-record="${r.id}">刪除</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <h2>其他團員公開的記帳</h2>
      <div id="othersRecordList"><div class="empty-state">載入中…</div></div>
    </div>
  `;

  document.getElementById('recDate').value = todayStr();

  const recCurrencyEl = document.getElementById('recCurrency');
  const recRateEl = document.getElementById('recRate');
  const recOtherFieldEl = document.getElementById('recOtherCurrencyField');
  const recOtherInputEl = document.getElementById('recOtherCurrency');
  recCurrencyEl.onchange = ()=>{
    const isTWD = recCurrencyEl.value === 'TWD';
    const isOther = recCurrencyEl.value === 'OTHER';
    recRateEl.disabled = isTWD;
    if(isTWD) recRateEl.value = '';
    recOtherFieldEl.classList.toggle('hidden', !isOther);
    if(!isOther) recOtherInputEl.value = '';
  };
  document.getElementById('recRateLiveBtn').onclick = ()=>fillLiveRate(recCurrencyEl, recRateEl, document.getElementById('recRateLiveBtn'));

  document.getElementById('addRecordForm').onsubmit = async (e)=>{
    e.preventDefault();
    const currency = recCurrencyEl.value;
    const exchangeRate = currency==='TWD' ? 1 : Number(recRateEl.value);
    if(currency!=='TWD' && (!exchangeRate || exchangeRate<=0)){ alert('請輸入這個幣別對台幣的匯率'); return; }
    const customCurrencyName = recOtherInputEl.value.trim();
    if(currency==='OTHER' && !customCurrencyName){ alert('請輸入幣別名稱'); return; }
    await db.collection('trips').doc(currentTrip.id).collection('personalRecords').add({
      title: document.getElementById('recTitle').value.trim(),
      amount: Number(document.getElementById('recAmount').value),
      currency, exchangeRate, customCurrencyName,
      date: document.getElementById('recDate').value,
      isPublic: document.getElementById('recPublic').checked,
      userId: currentUser.uid
    });
    clearTabCache('personal');
    renderPersonalTab(el);
  };

  el.querySelectorAll('[data-toggle-record]').forEach(btn=>{
    btn.onclick = async ()=>{
      const willBePublic = btn.dataset.public !== 'true';
      await db.collection('trips').doc(currentTrip.id).collection('personalRecords').doc(btn.dataset.toggleRecord).update({isPublic: willBePublic});
      clearTabCache('personal');
      renderPersonalTab(el);
    };
  });
  el.querySelectorAll('[data-del-record]').forEach(btn=>{
    btn.onclick = async ()=>{
      await db.collection('trips').doc(currentTrip.id).collection('personalRecords').doc(btn.dataset.delRecord).delete();
      clearTabCache('personal');
      renderPersonalTab(el);
    };
  });

  const othersEl = document.getElementById('othersRecordList');
  let html = '';
  for(const {member, records} of othersData){
    html += `<h3 style="font-size:13.5px;margin-top:14px;display:flex;align-items:center;">${avatarChipHTML(member,18)}${esc(member.displayName)}</h3>`;
    html += records.map(r=>`
      <div class="record-row">
        <div><div>${esc(r.title)}</div><div class="record-meta">${r.date}</div></div>
        <div class="expense-amount">${fmtCurrency(r.amount, r.currency, r.customCurrencyName)}</div>
      </div>
    `).join('');
  }
  othersEl.innerHTML = html || `<div class="empty-state">目前沒有其他人公開記帳</div>`;
}

// ---------------- 團員 ----------------
async function renderMembersTab(el){
  const isOwner = isMe(currentTrip.ownerId);
  el.innerHTML = `
    <div id="membersMsgBox"></div>
    <div class="card">
      <h2>團員名單</h2>
      <ul class="balance-list" id="memberListUl">
        ${currentMembers.map(m=>{
          const canManage = isOwner && m.uid !== currentTrip.ownerId;
          return `
          <li data-member-uid="${m.uid}">
            <span style="display:flex;align-items:center;min-width:0;">
              ${avatarChipHTML(m,24)}
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(m.displayName)}${isMe(m.uid)?'（我）':''}${m.uid===currentTrip.ownerId?' · 發起人':''}</span>
            </span>
            <span style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;">
              <span class="amount-neutral" style="font-size:11px;word-break:break-all;text-align:right;">${esc(m.email||'')}</span>
              ${canManage ? `
                <span style="display:flex;gap:6px;">
                  <button class="btn-danger" style="color:var(--matcha)" data-transfer-owner="${m.uid}">設為發起人</button>
                  <button class="btn-danger" data-remove-member="${m.uid}">移除</button>
                </span>
              ` : ''}
            </span>
          </li>
        `;}).join('')}
      </ul>
      <p class="subtitle" style="margin-top:14px">把行程代碼「<strong>${currentTrip.id}</strong>」分享給朋友，他們就可以加入這趟旅行。</p>
    </div>
    <div class="card">
      <h2>離開這趟旅行</h2>
      ${isOwner
        ? (currentMembers.length>1
            ? `<p class="subtitle" style="margin-bottom:0">你是發起人，請先把「發起人」身份轉移給其他團員，才能退出這個團。</p>`
            : `<p class="subtitle" style="margin-bottom:12px">目前只有你一個人在這個行程裡，退出等於刪除整個行程，且無法復原。</p>
               <button class="btn btn-outline btn-block" id="deleteTripBtn" style="border-color:var(--danger);color:var(--danger);">刪除這個行程</button>`)
        : `<p class="subtitle" style="margin-bottom:12px">退出後就看不到這個行程了，其他團員的資料不會受影響。</p>
           <button class="btn btn-outline btn-block" id="leaveTripBtn" style="border-color:var(--danger);color:var(--danger);">退出這個團</button>`
      }
    </div>
  `;

  el.querySelectorAll('[data-transfer-owner]').forEach(btn=>{
    btn.onclick = async ()=>{
      const uid = btn.dataset.transferOwner;
      if(!confirm(`確定要把發起人身份轉移給 ${nameOf(uid)} 嗎？轉移後你就不能再移除團員或轉移身份了。`)) return;
      try{
        await db.collection('trips').doc(currentTrip.id).update({ ownerId: uid });
        currentTrip.ownerId = uid;
        renderMembersTab(el);
      }catch(err){
        showMsg('membersMsgBox', '轉移失敗：'+err.message);
      }
    };
  });

  el.querySelectorAll('[data-remove-member]').forEach(btn=>{
    btn.onclick = async ()=>{
      const uid = btn.dataset.removeMember;
      if(!confirm(`確定要把 ${nameOf(uid)} 移出這個行程嗎？`)) return;
      try{
        await db.collection('trips').doc(currentTrip.id).update({
          members: firebase.firestore.FieldValue.arrayRemove(uid)
        });
        currentTrip.members = (currentTrip.members||[]).filter(u=>u!==uid);
        currentMembers = currentMembers.filter(m=>m.uid!==uid);
        renderMembersTab(el);
      }catch(err){
        showMsg('membersMsgBox', '移除失敗：'+err.message);
      }
    };
  });

  const leaveBtn = document.getElementById('leaveTripBtn');
  if(leaveBtn){
    leaveBtn.onclick = async ()=>{
      if(!confirm('確定要退出這個團嗎？')) return;
      try{
        await db.collection('trips').doc(currentTrip.id).update({
          members: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        });
        currentTrip = null;
        renderTripsView();
      }catch(err){
        showMsg('membersMsgBox', '退出失敗：'+err.message);
      }
    };
  }

  const deleteBtn = document.getElementById('deleteTripBtn');
  if(deleteBtn){
    deleteBtn.onclick = async ()=>{
      if(!confirm('確定要刪除這個行程嗎？這個動作無法復原。')) return;
      try{
        await db.collection('trips').doc(currentTrip.id).delete();
        currentTrip = null;
        renderTripsView();
      }catch(err){
        showMsg('membersMsgBox', '刪除失敗：'+err.message);
      }
    };
  }
}

document.addEventListener('click', (e)=>{
  const img = e.target.closest('[data-view-img]');
  if(!img) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<img src="${img.src}" style="max-width:100%;max-height:90vh;border-radius:12px;display:block;">`;
  overlay.onclick = ()=>overlay.remove();
  document.body.appendChild(overlay);
});

root.innerHTML = `<div class="empty-state">載入中…</div>`;
</script>
</body>
</html>
